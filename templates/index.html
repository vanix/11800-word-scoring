<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦軟體應用丙級 文書處理評分系統</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>電腦軟體應用丙級 · 文書處理評分</h1>
  <div class="data-links">
    <a href="/data/電丙題本.pdf" target="_blank">電丙題本</a>
    <a href="https://www.youtube.com/playlist?list=PLN9g1rvyo05rYFCEqocboBP6U8XdOl2w9" target="_blank">教學影片</a>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  <form action="/score" method="post" enctype="multipart/form-data" class="upload-form">
    <div class="form-group">
      <label for="exam_id">選擇題組：</label>
      <select name="exam_id" id="exam_id" required onchange="updateStages()">
        <option value="">— 請選擇 —</option>
        {% for e in exams %}
        <option value="{{ e.id }}" data-stages='{{ e.stages | tojson }}'>{{ e.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="stage">選擇階段：</label>
      <select name="stage" id="stage" required>
        <option value="">— 請先選題組 —</option>
      </select>
    </div>
    <div class="form-group">
      <label for="student_name">姓名：</label>
      <input type="text" name="student_name" id="student_name" placeholder="請輸入姓名" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="class_id">班級：</label>
        <select name="class_id" id="class_id" required>
          <option value="">— 請選擇 —</option>
          <option value="301">301</option>
          <option value="302">302</option>
          <option value="303">303</option>
          <option value="304">304</option>
          <option value="305">305</option>
        </select>
      </div>
      <div class="form-group">
        <label for="seat_no">座號：</label>
        <input type="text" name="seat_no" id="seat_no" placeholder="請輸入座號" required>
      </div>
    </div>
    <div class="form-group ip-row">
      <label>用戶端 IP：</label>
      <span class="ip-text">{{ client_ip }}</span>
    </div>
    <div class="form-group">
      <label for="file">上傳作答檔案 (.docx)：</label>
      <input type="file" name="file" id="file" accept=".docx" required>
    </div>
    <button type="submit">開始評分</button>
  </form>
</div>
<script>
function updateStages(){
  var sel = document.getElementById('exam_id');
  var st = document.getElementById('stage');
  var oo = sel.options[sel.selectedIndex];
  st.innerHTML = '<option value="">— 請選擇階段 —</option>';
  if(!oo || !oo.dataset.stages) return;
  JSON.parse(oo.dataset.stages).forEach(function(s){
    var op = document.createElement('option');
    op.value = s.id; op.textContent = s.name;
    st.appendChild(op);
  });
}
</script>
</body>
</html>
