<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦軟體應用丙級 文書處理評分系統</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>電腦軟體應用丙級 · 文書處理評分</h1>
  <div class="data-links">
    <a href="/course">課程資料</a>
    <a href="/exam">上機考要求</a>
    <a href="/status">繳交狀況</a>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  <form action="/score" method="post" enctype="multipart/form-data" class="upload-form">
    <div class="form-group">
      <label>選擇題組：</label>
      <div class="choice-group">
        {% for e in exams %}
        <input type="radio" name="exam_id" id="exam-{{ e.id }}" value="{{ e.id }}"
               data-stages='{{ e.stages | tojson }}' onchange="updateStages()" required>
        <label for="exam-{{ e.id }}">{{ e.name }}</label>
        {% endfor %}
      </div>
    </div>
    <div class="form-group">
      <label>選擇階段：</label>
      <div class="choice-group" id="stage-buttons">
        <span class="choice-hint">請先選題組</span>
        <noscript>
          <select name="stage" required>
            <option value="">— 請選擇階段 —</option>
            {% for e in exams %}
            <optgroup label="{{ e.name }}">
              {% for s in e.stages %}
              <option value="{{ s.id }}">{{ s.id }}. {{ s.name }}</option>
              {% endfor %}
            </optgroup>
            {% endfor %}
          </select>
        </noscript>
      </div>
    </div>
    <div class="form-group">
      <label>班級：</label>
      <div class="choice-group">
        {% for cid in ['111', '112', '301', '302', '303', '304', '305'] %}
        <input type="radio" name="class_id" id="cls-{{ cid }}" value="{{ cid }}"
               {{ 'checked' if cid == '301' }} required>
        <label for="cls-{{ cid }}">{{ cid }}</label>
        {% endfor %}
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="student_name">姓名：</label>
        <input type="text" name="student_name" id="student_name" placeholder="請輸入姓名" required>
      </div>
      <div class="form-group">
        <label for="seat_no">座號：</label>
        <input type="text" name="seat_no" id="seat_no" placeholder="請輸入座號（0-50）" required>
      </div>
    </div>
    <div class="form-group ip-row">
      <label>用戶端 IP：</label>
      <span class="ip-text">{{ client_ip }}</span>
    </div>
    <div class="form-group">
      <label for="file">上傳作答檔案 (.docx)：</label>
      <input type="file" name="file" id="file" accept=".docx" required>
    </div>
    <button type="submit">開始評分</button>
  </form>
</div>
<script>
function updateStages(){
  var exam = document.querySelector('input[name="exam_id"]:checked');
  var box = document.getElementById('stage-buttons');
  box.innerHTML = '';
  if (!exam) {
    box.innerHTML = '<span class="choice-hint">請先選題組</span>';
    return;
  }
  var stages = JSON.parse(exam.dataset.stages || '[]');
  stages.forEach(function(s){
    var input = document.createElement('input');
    input.type = 'radio';
    input.name = 'stage';
    input.id = 'stage-' + s.id;
    input.value = s.id;
    input.required = true;

    var label = document.createElement('label');
    label.htmlFor = input.id;
    var num = document.createElement('span');
    num.className = 'chip-num';
    num.textContent = s.id;
    var text = document.createElement('span');
    text.className = 'chip-text';
    text.textContent = s.name;
    label.appendChild(num);
    label.appendChild(text);

    box.appendChild(input);
    box.appendChild(label);
  });
}
</script>
</body>
</html>
